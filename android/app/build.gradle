apply plugin: 'com.android.application'

// Release signing credentials, read from android/keystore.properties (git-ignored)
// or, failing that, the ENLIGHTENED_KEYSTORE/_PASSWORD/_ALIAS/_KEY_PASSWORD
// environment variables. If neither is present the release build stays unsigned.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def ksStore = keystoreProps.getProperty('storeFile') ?: System.getenv('ENLIGHTENED_KEYSTORE')
def ksStorePassword = keystoreProps.getProperty('storePassword') ?: System.getenv('ENLIGHTENED_KEYSTORE_PASSWORD')
def ksAlias = keystoreProps.getProperty('keyAlias') ?: System.getenv('ENLIGHTENED_KEYSTORE_ALIAS')
def ksKeyPassword = keystoreProps.getProperty('keyPassword') ?: System.getenv('ENLIGHTENED_KEYSTORE_KEY_PASSWORD')
def ksFile = ksStore == null ? null : (ksStore.startsWith('/') ? file(ksStore) : rootProject.file(ksStore))
def canSignRelease = ksFile != null && ksFile.exists() && ksStorePassword != null && ksAlias != null
if (!canSignRelease) {
    logger.lifecycle("No release signing key configured -- release builds will be unsigned. " +
                     "See android/keystore.properties.template.")
}

// versionCode counts commits so each build installs over the previous one;
// Android refuses to install a lower versionCode than the one already present.
def gitCommitCount = {
    try {
        def proc = ['git', 'rev-list', '--count', 'HEAD'].execute(null, rootProject.projectDir)
        proc.waitFor()
        def count = proc.inputStream.text.trim()
        return proc.exitValue() == 0 && count ? count.toInteger() : 1
    } catch (Exception ignored) {
        return 1   // not a git checkout (e.g. exported source)
    }
}()

def gitDescription = {
    try {
        def proc = ['git', 'describe', '--tags', '--always', '--dirty'].execute(null, rootProject.projectDir)
        proc.waitFor()
        def desc = proc.inputStream.text.trim()
        return proc.exitValue() == 0 && desc ? desc : 'unknown'
    } catch (Exception ignored) {
        return 'unknown'
    }
}()

android {

    namespace 'io.ionic.enlightened'
    compileSdkVersion rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.ionic.enlightened"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode gitCommitCount
        versionName "1.0.${gitCommitCount} (${gitDescription})"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (canSignRelease) {
                storeFile ksFile
                storePassword ksStorePassword
                keyAlias ksAlias
                keyPassword ksKeyPassword ?: ksStorePassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (canSignRelease) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
